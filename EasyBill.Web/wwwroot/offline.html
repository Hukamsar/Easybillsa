<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Easy Bill</title>
    <link href="/lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/lib/bootstrap/dist/css/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .offline-card {
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background-color: #fee2e2;
            color: #ef4444;
            border-radius: 50%;
            margin-bottom: 1.5rem;
        }
        .icon-container i {
            font-size: 2.5rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-retry {
            background-color: #1d4ed8;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-retry:hover {
            background-color: #1e40af;
            color: #ffffff;
        }
        .btn-retry:active {
            transform: scale(0.98);
        }
        .offline-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.75rem;
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            border-radius: 9999px;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <span class="offline-badge">Offline Mode</span>
        <div class="icon-container">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h1>No Internet Connection</h1>
        <p>
            It looks like your internet connection is down. EasyBill has loaded in offline mode. You can still navigate pages you have recently visited, but actions requiring server validation (such as saving new bills or registration) will resume once you are back online.
        </p>
        <button class="btn btn-retry w-100" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise me-1"></i> Try Reconnecting
        </button>
    </div>
</body>
</html>
